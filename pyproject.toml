[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nysolarforecastlab"
version = "0.1.0"
description = "Benchmark code for day-ahead photovoltaic power forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
nysolarforecastlab = "nysolarforecastlab.cli:main"

[tool.setuptools.packages.find]
include = ["nysolarforecastlab*"]

[tool.setuptools.package-data]
"nysolarforecastlab.config" = ["plant_template.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

[tool.black]
line-length = 100
target-version = ["py310"]
